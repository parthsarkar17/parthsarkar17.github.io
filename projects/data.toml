[[project]]
name = "Extending Softbound with a \"Formally Verified\" Pass"
desc = "Softbound (Nagarakatte et. al) is an LLVM pass that instruments C programs with runtime checks that guarantee spatial and temporal memory safety. For my ESE 5370 final project (Hardware Security), I added an LLVM pass that carefully elides some of these runtime checks, while still making sure compiled programs retain the property of memory safety. Also, in the spirit of formal verification introduced by the original paper, I faithfully encoded the pass in the Rocq theorem prover; I proved monotonicity on the intraprocedural dataflow setup I used."
tags = ["LLVM", "Rocq", "Compiler", "Memory Safety"]
img = ""
links = [
